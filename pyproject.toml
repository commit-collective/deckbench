[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deckbench"
dynamic = ["version"]
description = "Simulated DJ decks on a network, for testing what talks to them (Pro DJ Link)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
deckbench = "deckbench.cli:main"

[tool.setuptools.dynamic]
version = { attr = "deckbench.__version__" }   # the one place the version is written

[tool.setuptools.packages.find]
include = ["deckbench", "deckbench.*"]

[tool.setuptools.package-data]
deckbench = ["ui/*", "examples/*.json", "examples/unit/*.json"]
