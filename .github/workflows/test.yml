name: tests

# Linux and Windows. macOS is not tested: its loopback carries no broadcasts, so the decks on 127.0.0.n are not heard there
# (27 of the 115 tests failed), and a job that is allowed to fail only hides that behind a green badge.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee test-output.txt
      - name: Say what failed
        if: failure()
        shell: bash
        run: python tools/ci_report.py test-output.txt
