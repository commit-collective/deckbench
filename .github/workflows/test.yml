name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Loopback aliases (macOS has only 127.0.0.1)
        if: runner.os == 'macOS'
        run: for n in 2 3 4 5 6 7 8 9; do sudo ifconfig lo0 alias 127.0.0.$n up; done
      - name: Tests
        run: python -m unittest discover -s tests
