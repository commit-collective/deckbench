name: tests

# Full broadcast integration runs on Linux and Windows. The Mac job checks
# native unicast, adapter parsing, browser assets and packaging, not DJ hardware.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Native macOS checks
        shell: bash
        run: |
          set -o pipefail
          python -u -m unittest discover -s tests -p test_macos.py -v 2>&1 | tee test-output.txt
          python -u -m unittest discover -s tests -p test_demo.py -v 2>&1 | tee -a test-output.txt
          python -u -m unittest discover -s tests -p test_shared_host.py -v 2>&1 | tee -a test-output.txt
      - name: Check installed package
        run: |
          python -m pip install --no-deps .
          python -I tools/check_installed.py
      - name: Say what failed
        if: failure()
        run: python tools/ci_report.py test-output.txt
      - name: Keep test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests-macos-15-3.12
          path: test-output.txt
          if-no-files-found: ignore
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -u -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Check installed package
        run: |
          python -m pip install --no-deps .
          python -I tools/check_installed.py
      - name: Say what failed
        if: failure()
        shell: bash
        run: python tools/ci_report.py test-output.txt
      - name: Keep test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-output.txt
          if-no-files-found: ignore
