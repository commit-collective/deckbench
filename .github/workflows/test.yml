name: tests

# Linux and Windows. macOS is not tested: its loopback carries no broadcasts, so the decks on 127.0.0.n are not heard there
# A job that is allowed to fail only hides that behind a green badge.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -u -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Check installed package
        run: |
          python -m pip install --no-deps .
          python -I tools/check_installed.py
      - name: Say what failed
        if: failure()
        shell: bash
        run: python tools/ci_report.py test-output.txt
      - name: Keep test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-output.txt
          if-no-files-found: ignore
